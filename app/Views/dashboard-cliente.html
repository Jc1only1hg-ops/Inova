<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ineova Market · Cliente</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS del dashboard -->
    <link rel="stylesheet" href="css/dashboard-cliente.css">
</head>
<body class="dashboard-body">

<div class="dashboard-wrapper">
    <!-- Barra superior -->
    <header class="dashboard-header">
        <div class="header-left">
            <div class="logo-area">
                <a href="index.html" class="logo-linkedin">
                    <span>Ine</span>
                </a>
                <div class="logo-text">Ine<span>ova</span><span class="portal-badge">Portal</span></div>
            </div>
        </div>
        <div class="header-right">
            <div class="user-menu">
                <span class="user-name"><i class="fas fa-user-circle"></i> <span id="nombre-usuario">María</span></span>
                <div class="user-dropdown">
                    <a href="#"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#"><i class="fas fa-briefcase"></i> Mis postulaciones</a>
                    <a href="#"><i class="fas fa-heart"></i> Ofertas guardadas</a>
                    <hr>
                    <a href="index.html" class="logout-link"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="dashboard-main">
        <div class="welcome-section">
            <h1>¡Bienvenida, <span id="welcome-nombre">María</span>!</h1>
            <p>Estas son las mejores ofertas de pasantías y empleos para ti hoy</p>
        </div>

        <!-- Buscador -->
        <div class="search-section">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Buscar pasantías, áreas profesionales, empresas...">
            </div>
            <button class="btn-primary btn-filter" id="filter-btn"><i class="fas fa-sliders-h"></i> Filtrar</button>
        </div>

        <!-- Categorías en caja contenedora (NUEVO CAJÓN) -->
        <div class="categories-section">
            <div class="category-box">
                <h3 class="category-box-title">Áreas Profesionales</h3>
                <hr class="category-divider">
                <div class="category-grid" id="category-grid-container">
                    <!-- Las tarjetas se generarán con JavaScript -->
                </div>
            </div>
        </div>

        <!-- Parrilla de productos -->
        <div class="products-grid" id="products-grid">
            <div class="loading-products">Cargando productos...</div>
        </div>
    </main>
</div>

<!-- Modal de Detalle de Oferta -->
<div class="modal" id="offer-modal">
    <div class="modal-content">
        <span class="close-modal" id="close-modal-btn">&times;</span>
        <div class="modal-body" id="modal-body-content">
            <!-- Contenido dinámico -->
        </div>
    </div>
</div>

<!-- JavaScript del dashboard -->
<script src="scripts/dashboard-cliente.js"></script>
</body>
</html>
